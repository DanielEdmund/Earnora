version: "3.9"

# Optional: run the platform against real Postgres + Redis instead of the
# embedded defaults. Start with:  docker compose up -d
# Then set DATABASE_URL and REDIS_URL in .env (see .env.example).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: earnora
      POSTGRES_PASSWORD: earnora
      POSTGRES_DB: earnora
    ports:
      - "127.0.0.1:5432:5432"   # localhost only — never expose the DB publicly
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U earnora"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"   # localhost only — Redis has no auth by default
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
